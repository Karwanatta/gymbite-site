name: Publish GymBite static site

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - cursor/gymbite-static-host-8ba4

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: gymbite-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.3.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build static site
        run: pnpm build:static
        env:
          SITE_URL: https://karwanatta.github.io
          NEXT_PUBLIC_BASE_PATH: /gymbite-site
          STATIC_OUT_DIR: out
      - name: Drop Cloudflare-only header rules
        run: rm -f out/_headers
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out
      - id: deployment
        uses: actions/deploy-pages@v4
